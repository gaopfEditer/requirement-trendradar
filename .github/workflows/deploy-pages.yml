name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys; never "Re-run failed jobs" on a run that already uploaded
# github-pages — that leaves 2 artifacts with the same name (deploy-pages then fails).
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
