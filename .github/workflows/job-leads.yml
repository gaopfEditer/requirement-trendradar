name: Job Leads Ingest

on:
  schedule:
    # Every 5 hours UTC
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "job-leads-ingest"
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest job leads
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -m scripts.ingest_job_leads --no-merge-opportunities

      - name: Publish job_leads to public/data
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -m scripts.publish_site

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/job_leads.json data/runs.json data/meta.json public/data/ || true
          if git diff --staged --quiet; then
            echo "No job lead changes to commit"
          else
            git commit -m "chore(jobs): job leads snapshot"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: ingest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
